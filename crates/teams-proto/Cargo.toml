[package]
name = "teams-proto"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unofficial client library for the Microsoft Teams chat protocol"
publish = false

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "form", "query", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
flate2 = "1.1.11"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
