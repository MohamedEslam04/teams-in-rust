[package]
name = "appearance"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IronTeams appearance preferences: theme, accent, density and font scale, plus the XDG desktop portal reader"
publish = false

[dependencies]
compat = { version = "0.0.0", path = "../compat" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4"] }
# `async-io` runs its own reactor, so it works from any thread and inside a tokio runtime
# (the `tokio` feature panics when ksni drives zbus from its async-io executor).
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
