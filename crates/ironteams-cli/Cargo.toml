[package]
name = "ironteams-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line client for IronTeams (protocol testing)"
publish = false

[dependencies]
compat = { version = "0.0.0", path = "../compat" }
anyhow = "1.0.104"
appearance = { version = "0.0.0", path = "../appearance" }
app_store = { package = "apps", version = "0.0.0", path = "../apps" }
devices = { version = "0.0.0", path = "../devices" }
diag = { version = "0.0.0", path = "../diag" }
calling = { version = "0.0.0", path = "../calling" }
calendar = { version = "0.0.0", path = "../calendar" }
render = { version = "0.0.0", path = "../render" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.3.4"
reqwest = { version = "0.13.5", default-features = false }
sha2 = "0.10.9"
rmcp = { version = "3.11.0", features = ["transport-io"], optional = true }
schemars = { version = "1.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = "1.0.154"
onedrive = { version = "0.0.0", path = "../onedrive" }
preview = { version = "0.0.0", path = "../preview" }
session = { version = "0.0.0", path = "../session" }
teams-proto = { version = "0.0.0", path = "../teams-proto" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray = { version = "0.0.0", path = "../tray" }
url = "2.5.8"
webhost = { version = "0.0.0", path = "../webhost" }

[features]
# The MCP server (`ironteams-cli mcp`, docs/mcp.md). Off by default: release builds do not
# contain it.
mcp = ["dep:rmcp", "dep:schemars", "dep:serde"]
