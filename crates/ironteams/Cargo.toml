[package]
name = "ironteams"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IronTeams — an unofficial native Microsoft Teams client written in Rust"
publish = false

[dependencies]
compat = { version = "0.0.0", path = "../compat" }
anyhow = "1.0.104"
app_store = { package = "apps", version = "0.0.0", path = "../apps" }
appearance = { version = "0.0.0", path = "../appearance" }
devices = { version = "0.0.0", path = "../devices" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
calendar = { version = "0.0.0", path = "../calendar" }
# Native calls and meetings (the call window); behind `calls` so ironteams still builds without it.
calling = { version = "0.0.0", path = "../calling", optional = true }
diag = { version = "0.0.0", path = "../diag" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
emoji = { version = "0.0.0", path = "../emoji" }
iana-time-zone = "0.1.65"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify-rust = "4.19.0"
onedrive = { version = "0.0.0", path = "../onedrive" }
open = "5.4.5"
preview = { version = "0.0.0", path = "../preview" }
reqwest = "0.13.5"
render = { version = "0.0.0", path = "../render" }
rfd = "0.18.0"
serde_json = "1.0.154"
session = { version = "0.0.0", path = "../session" }
slint = { version = "~1.19", features = ["unstable-winit-030"] }
store = { version = "0.0.0", path = "../store" }
teams-proto = { version = "0.0.0", path = "../teams-proto" }
voice = { version = "0.0.0", path = "../voice" }
# Self-updates for Velopack installs (Setup.exe, the .pkg, the AppImage): delta downloads from the
# GitHub releases, applied on restart or quit. Keep it on the same version as `vpk` in release.yml.
velopack = "=1.2.161"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray = { version = "0.0.0", path = "../tray" }
webhost = { version = "0.0.0", path = "../webhost" }
spellbook = "0.4.2"

[features]
default = ["calls"]
calls = ["dep:calling"]

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"
