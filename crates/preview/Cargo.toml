[package]
name = "preview"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IronTeams file preview: PDF pages to RGBA (pure Rust, hayro) and Office files to PDF through Graph"
publish = false

[dependencies]
hayro = "0.9.0"
onedrive = { version = "0.0.0", path = "../onedrive" }
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false }
teams-proto = { version = "0.0.0", path = "../teams-proto" }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
