[package]
name = "calling"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Teams calling for IronTeams: NGC signalling (epconv), trouter call pushes, WebRTC media, audio I/O"
publish = false

[dependencies]
compat = { version = "0.0.0", path = "../compat" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util"] }
tracing = "0.1.44"

# --- signalling (signaling.rs, invitation.rs, relay.rs, ngc_trouter.rs) ---
teams-proto = { version = "0.0.0", path = "../teams-proto" }
base64 = "0.23.1"
# zlib-rs backend: media needs `set_dictionary` for deflated NGC SDP blobs.
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }

# --- media (media.rs) ---
webrtc = "=0.21.1"
rtc = { version = "=0.21.1", default-features = false }
async-trait = "0.1.89"
bytes = "1.12.0"
rand = "0.10.4"

# --- TURN over TLS (relay/tls.rs) ---
# Already in the tree through reqwest and tokio-tungstenite. The relays speak TLS 1.2 only.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"

# --- audio (audio/) ---
# `opus` bundles libopus via opusic-sys (cmake), so no system opus-devel is needed.
opus = "0.4.0"
cpal = { version = "0.18.2", optional = true }
# Device lists and the choice of device (on Linux through the sound server), shared with Settings.
devices = { version = "0.0.0", path = "../devices", default-features = false, features = ["audio"], optional = true }
hound = "3.5.1"
# Echo cancellation (AEC3), noise suppression and AGC2: a pure Rust port of WebRTC's audio
# processing module, so no C++ toolchain, meson or system webrtc-audio-processing is needed.
sonora = { version = "0.3.0", optional = true }
# RNNoise (BSD-3-Clause), pure Rust, 48 kHz native with 10 ms frames: WebRTC's noise suppression
# models steady noise only, so clicks and key presses pass it; RNNoise removes them.
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }

# --- video (video/) ---
# H.264 through Cisco's OpenH264, built from the bundled source with the C++ compiler (no system
# openh264-devel). The camera will use the same encoder and track (`video::VideoRole`).
openh264 = { version = "0.9.10", optional = true }
ab_glyph = { version = "0.2.32", optional = true }
# Person segmentation for the background effects (`video::effects`): a pure Rust ONNX runtime, so
# no C++ toolchain or system library. The model is bundled (`assets/segmentation`, Apache-2.0).
tract-onnx = { version = "0.23.10", default-features = false, optional = true }

# Linux only: Windows and macOS capture through GStreamer's own screen and camera sources
# (`video::screencast`, `video::camera`) and have no remote control or control cursor yet.
[target.'cfg(target_os = "linux")'.dependencies]
# The ScreenCast portal (D-Bus, pure Rust; zbus 6 is already in the tree through notify-rust).
# The PipeWire stream it hands over is read by a `gst-launch-1.0 pipewiresrc` child process, so
# no pipewire-devel/gstreamer1-devel is needed at build time.
ashpd = { version = "0.14.1", default-features = false, features = ["tokio", "screencast"], optional = true }
# The controller's cursor over a share under remote control (`video::control_overlay`): a
# wlr-layer-shell surface drawn in software. Both are already in the tree (smithay-clipboard and
# sctk-adwaita); sctk without its xkbcommon feature needs only libwayland, no system xkbcommon.
smithay-client-toolkit = { version = "0.20.0", default-features = false, features = ["calloop"], optional = true }

[dev-dependencies]
# Test certificates for the TURN-over-TLS shim (already in the tree through rtc).
rcgen = "0.14.10"

[features]
default = ["devices", "aec", "screen-share", "camera", "effects"]
# Microphone/speaker I/O through cpal (needs alsa-lib-devel on Linux). The Opus codec, WAV and tone
# endpoints build without it.
devices = ["dep:cpal", "dep:devices"]
# Echo cancellation, noise suppression and AGC on the microphone path (pure Rust, no system deps).
aec = ["dep:sonora", "dep:nnnoiseless"]
# Screen sharing: the ScreenCast portal and the H.264 encoder. Runtime needs xdg-desktop-portal and
# GStreamer's `pipewiresrc` (gstreamer1-plugins / pipewire-gstreamer). The RemoteDesktop portal
# (remote control of a share, `video::remote_input`) is the same crate, no new library.
# The controller's cursor is a wlr-layer-shell overlay (smithay-client-toolkit, ab_glyph).
screen-share = [
    "dep:openh264",
    "dep:ashpd",
    "ashpd/remote_desktop",
    "dep:smithay-client-toolkit",
    "dep:ab_glyph",
]
# Camera video: the Camera portal (or a V4L2 device) through the same GStreamer child and H.264
# encoder, and the OpenH264 decoder for the other side's video. Runtime needs GStreamer's
# `pipewiresrc` (portal) or `v4l2src` (gstreamer1-plugins-good) and `decodebin`.
camera = ["screen-share", "ashpd/camera"]
# Video effects on the camera (background blur and replacement, filters): tract runs the bundled
# person-segmentation model on the CPU.
effects = ["camera", "dep:tract-onnx"]

[[example]]
name = "screencast"
required-features = ["screen-share"]
