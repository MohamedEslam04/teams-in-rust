[package]
name = "tray"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IronTeams tray: StatusNotifierItem tray icon with unread badge, Unity launcher badge and login autostart (XDG, Windows Run key, macOS LaunchAgent)"
publish = false

[dependencies]
# Pure Rust StatusNotifierItem over zbus; no system library. Uses the `async-io` runtime feature
# because slint enables `ksni/async-io` and ksni refuses `tokio` and `async-io` together.
# Receiver is Clone and Sync, so the UI can hand clones of `events()` to any thread.
crossbeam-channel = "0.5.17"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
# Logs the idle source and the Wayland idle notification's events (presence's Away).
tracing = "0.1.44"

# The StatusNotifierItem and the launcher badge are D-Bus, Linux only. Windows and macOS show the
# tray through Slint's SystemTrayIcon in the app (`ironteams::native_tray`).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
# Same major as ksni's zbus, so one copy is built. Used for the Unity LauncherEntry signal.
# async-io, not tokio: ksni drives zbus from its own async-io executor, and the tokio feature makes
# zbus panic there ("no reactor running"). async-io has its own reactor, so it also works inside tokio.
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
# Idle time on Wayland (`ext_idle_notifier_v1`, a staging protocol), where KDE refuses the D-Bus
# idle query. The versions Slint's winit already builds, so no second copy.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

# Autostart: the per-user Run key. Idle time: the last input tick.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile = "3.27.0"
