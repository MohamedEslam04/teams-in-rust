# Flatpak manifest for ironteams. See packaging/flatpak/README.md for how to build it.
app-id: io.github.mohamedeslam04.ironteams
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ironteams

finish-args:
  # Teams chat, push channel, Graph and OneDrive.
  - --share=network
  # Window system: Wayland first. The notification cards are drawn on the Wayland socket where
  # the compositor has the layer shell (KDE Plasma, Sway); elsewhere (GNOME) the card host is an
  # X11 window through XWayland, so X11 is granted next to Wayland, not only as a fallback.
  # --share=ipc is needed by X11 (MIT-SHM).
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  # GPU renderer (IRONTEAMS_RENDERER=femtovg). The default software renderer works without it.
  - --device=dri
  # Audio through PipeWire's PulseAudio socket, plus PipeWire itself for the meeting host
  # (camera, screen share and low-latency audio go through the portals and this socket).
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # The tray icon (StatusNotifierItem, named after the pid, which is 2 inside the sandbox) and the
  # screen-lock check that keeps the presence Away while the screen is locked.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
  - --talk-name=org.freedesktop.ScreenSaver
  # The refresh token lives in the Secret Service (GNOME Keyring or KWallet).
  - --talk-name=org.freedesktop.secrets
  # Portals (file chooser, open URI, camera, screencast) need no extra permission:
  # xdg-desktop-portal is always reachable from the sandbox. Call video uses the Camera portal
  # only here: its V4L2 fallback would need --device=all, which is not granted. Attachments and problem reports
  # are saved to the Downloads folder.
  - --filesystem=xdg-download

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/ironteams/cargo
    CARGO_NET_OFFLINE: 'true'
    # One compile job: the build host and CI runners are short on memory.
    CARGO_BUILD_JOBS: '1'
    # The ironteams crate (Slint-generated code) with thin LTO and one codegen unit needs more
    # than a 16 GB runner, and the build container cannot add swap. Same settings as the AUR check.
    CARGO_PROFILE_RELEASE_LTO: 'off'
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

modules:
  - name: ironteams
    buildsystem: simple
    build-commands:
      # CI restores the cargo target of an earlier build as flatpak-target/ (packaging.yml). Its
      # outputs can be newer than the copied sources, so the sources get the current time and cargo
      # rebuilds every workspace crate; the vendored crates in cargo/ are matched by version.
      - if [ -d flatpak-target ]; then rm -rf target && mv flatpak-target target && find . -path ./target
        -prune -o -path ./cargo -prune -o -type f -exec touch {} +; fi
      - cargo --offline build --release --locked -p ironteams
      - install -Dm755 target/release/ironteams /app/bin/ironteams
      - install -Dm644 packaging/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 packaging/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      # For a local build. Flathub would use a git source pinned to a tag instead:
      #   - type: git
      #     url: https://github.com/MohamedEslam04/teams-in-rust.git
      #     tag: v0.1.0
      - type: dir
        path: ../..
        skip: [target, .git, .claude]
      # Vendored crates, generated from Cargo.lock (see README.md in this folder).
      - cargo-sources.json
