# Optional packaging builds. They are slow, so they never run on pull requests: start them by
# hand from the Actions tab, or push a branch named ci/packaging-* to test changes before they reach
# dev (a manual run needs the workflow on the default branch). The release runs them too.
name: Packaging

on:
  workflow_dispatch:
  # release.yml runs these too and attaches the RPM and the Flatpak to the release.
  workflow_call:
  push:
    branches: ['ci/packaging-*']
    paths: ['packaging/**', 'Cargo.lock', '.github/workflows/packaging.yml']

jobs:
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: fedora:latest
      options: --privileged -v /mnt:/mnt
    steps:
      - name: More swap
        # rustc compiling the ironteams crate (Slint-generated code, thin LTO, one codegen unit) needs
        # more than the runner's ~16 GB and gets SIGKILLed. The swap file lives on the host's /mnt
        # (bind-mounted): swap cannot sit on the container's overlay filesystem.
        run: |
          command -v mkswap >/dev/null || dnf -y install util-linux >/dev/null 2>&1 || true
          swapoff -a 2>/dev/null || true
          fallocate -l 12G /mnt/swapfile 2>/dev/null || dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288 status=none
          chmod 600 /mnt/swapfile
          mkswap /mnt/swapfile >/dev/null && swapon /mnt/swapfile
          cat /proc/swaps
      - name: Tools
        run: dnf -y install rpm-build git cargo rust gcc gcc-c++ cmake pkgconf-pkg-config desktop-file-utils tar xz zstd 'pkgconfig(alsa)' 'pkgconfig(fontconfig)' 'pkgconfig(xkbcommon)' 'pkgconfig(dbus-1)' libappstream-glib
      - uses: actions/checkout@v7
      - name: Rust version
        id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # The cargo target dir lives outside rpmbuild's BUILD dir, so it can be cached. Only dev saves
      # it (cache-warm.yml runs this nightly); a release tag restores dev's copy. The key has no
      # commit: the spec rebuilds the workspace crates every time, so only the dependencies (set by
      # Cargo.lock and the compiler) are worth keeping, and one copy stays within the 10 GB limit.
      - uses: actions/cache/restore@v6
        id: rpm-cache
        with:
          path: rpm-target
          key: rpm-target-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rpm-target-${{ steps.rust.outputs.version }}-
      - name: Build the RPM
        env:
          # As release.yml: compiles the large ironteams crate in parallel, with less memory.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
          CARGO_TARGET_DIR: ${{ github.workspace }}/rpm-target
        run: |
          git config --global --add safe.directory "$PWD"
          top=$PWD/rpmtop; v=0.1.6
          mkdir -p "$top"/{SOURCES,BUILD,RPMS,SRPMS,BUILDROOT}
          git archive --prefix=ironteams-$v/ -o "$top/SOURCES/ironteams-$v.tar.gz" HEAD
          # Versioned dirs: a vendored crate named `xml` (velopack's) would otherwise sit at vendor/xml,
          # where atspi-common's build-time D-Bus checks look for their XML files.
          cargo vendor --locked --versioned-dirs vendor-dir/vendor
          tar -C vendor-dir -c vendor | xz -T0 > "$top/SOURCES/ironteams-$v-vendor.tar.xz"
          rpmbuild -bb --define "_topdir $top" packaging/rpm/ironteams.spec
      - uses: actions/cache/save@v6
        if: always() && github.ref == 'refs/heads/dev' && steps.rpm-cache.outputs.cache-hit != 'true'
        with:
          path: rpm-target
          key: rpm-target-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/upload-artifact@v7
        with:
          name: ironteams-rpm
          path: rpmtop/RPMS/**/*.rpm

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged -v /mnt:/mnt
    steps:
      - name: More swap
        # As the rpm job: swap on the host's /mnt (bind-mounted), since it cannot sit on the
        # container's overlay filesystem. This image has neither mkswap nor swapon, so Python
        # writes the swap header and calls swapon(2) itself. Fails the job if no swap is added.
        run: |
          fallocate -l 12G /mnt/swapfile 2>/dev/null || dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288 status=none
          chmod 600 /mnt/swapfile
          python3 -I -c '
          import ctypes, os, struct, sys
          path, ps = b"/mnt/swapfile", os.sysconf("SC_PAGE_SIZE")
          pages = os.path.getsize(path) // ps
          with open(path, "r+b") as f:
              f.seek(1024)
              f.write(struct.pack("<III16s16s", 1, pages - 1, 0, os.urandom(16), bytes(16)))
              f.seek(ps - 10)
              f.write(b"SWAPSPACE2")
          libc = ctypes.CDLL(None, use_errno=True)
          if libc.swapon(path, 0) != 0:
              sys.exit("swapon: " + os.strerror(ctypes.get_errno()))
          '
          cat /proc/swaps
          grep -q /mnt/swapfile /proc/swaps
      - uses: actions/checkout@v7
      - name: Generate cargo-sources.json
        run: |
          # The image sets PYTHONPATH to /app/lib/python3.13/site-packages, so pip believes aiohttp is
          # installed already and skips it, then `python3 -I` ignores that path and fails.
          unset PYTHONPATH
          python3 -m venv /tmp/gen
          /tmp/gen/bin/pip -q install 'aiohttp>=3.9.5,<4' 'PyYAML>=6.0.2,<7' 'tomlkit>=0.13.3,<1'
          curl -fsSL -o /tmp/gen/flatpak-cargo-generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
          /tmp/gen/bin/python3 -I /tmp/gen/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ironteams.flatpak
          manifest-path: packaging/flatpak/io.github.mohamedeslam04.ironteams.yml
          cache-key: flatpak-${{ hashFiles('Cargo.lock') }}

  aur:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base-devel
      options: --privileged -v /mnt:/mnt
    steps:
      - name: More swap
        # As the rpm job: swap on the host's /mnt (bind-mounted), since it cannot sit on the
        # container's overlay filesystem.
        run: |
          command -v mkswap >/dev/null || pacman -Sy --noconfirm util-linux >/dev/null 2>&1 || true
          swapoff -a 2>/dev/null || true
          fallocate -l 12G /mnt/swapfile 2>/dev/null || dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288 status=none
          chmod 600 /mnt/swapfile
          mkswap /mnt/swapfile >/dev/null && swapon /mnt/swapfile
          cat /proc/swaps
      - name: Tools
        run: pacman -Syu --noconfirm --needed git rust cmake alsa-lib fontconfig libxkbcommon libxkbcommon-x11 dbus wayland libx11 libxcursor libxi libxrender libglvnd namcap
      - uses: actions/checkout@v7
      - name: Build the package (makepkg refuses to run as root)
        run: |
          useradd -m builder
          git config --global --add safe.directory "$PWD"
          cp -r packaging/aur /home/builder/aur && chown -R builder /home/builder/aur
          # Build the checked-out commit instead of the default branch of the upstream URL.
          git clone --bare . /home/builder/ironteams.git && chown -R builder /home/builder/ironteams.git
          sed -i 's|git+${url}.git|git+file:///home/builder/ironteams.git|' /home/builder/aur/PKGBUILD
          # The runner has ~16 GB: even with the swap above, thin LTO with one codegen unit is slow
          # and close to the limit. This check only needs the package to build, so it links
          # without LTO (the shipped release profile is unchanged).
          su builder -c 'export CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16; cd ~/aur && git config --global --add safe.directory "*" && makepkg --printsrcinfo > /tmp/srcinfo && makepkg -f --noconfirm'
      - name: .SRCINFO is current
        run: diff <(sed 's|file:///home/builder/ironteams.git|https://github.com/MohamedEslam04/teams-in-rust.git|' /tmp/srcinfo) packaging/aur/.SRCINFO
        shell: bash
