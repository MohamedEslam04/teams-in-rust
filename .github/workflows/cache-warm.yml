# Keeps the build caches of the default branch warm, so a release (tags can only restore caches
# saved on the default branch) and the Windows/macOS gate do not compile everything from scratch.
# Nothing here is published. The release builds use the same cache keys (`shared-key`) and the same
# cargo settings as release.yml; keep the two in step.
name: Cache warm-up

on:
  schedule:
    # Every night (UTC); a run with nothing new only restores and checks the caches.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: cache-warm
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # As in release.yml.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  # The Windows and macOS clippy and test gate: run on the default branch, it saves their caches.
  gate:
    uses: ./.github/workflows/ci.yml
    with:
      all-platforms: true

  # The RPM build's cargo cache (and the Flatpak's) is saved from here; the release restores it.
  packages:
    uses: ./.github/workflows/packaging.yml

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config squashfs-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
      - run: cargo build --release --locked -p ironteams --bin ironteams

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - run: cargo build --release --locked -p ironteams --bin ironteams

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-${{ matrix.arch }}
      - run: cargo build --release --locked -p ironteams --bin ironteams
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

  # GitHub keeps 10 GB of caches per repository and drops the least recently used beyond that, which
  # would send a release back to a cold build. Every run here restores every cache in use, so a cache
  # nobody restored for 3 days is a stale copy (an old Cargo.lock or compiler): delete it, then warn
  # well before the limit is reached.
  cache-usage:
    needs: [gate, packages, linux, windows, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            -q ".actions_caches[] | select(.last_accessed_at < \"$cutoff\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" && echo "deleted stale cache $id"; done
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            -q '.actions_caches[] | "\(.size_in_bytes / 1048576 | floor) MB  \(.ref)  \(.key)"' | sort -rn
          used=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" -q .active_caches_size_in_bytes)
          gb=$(awk "BEGIN { printf \"%.1f\", $used / 1073741824 }")
          echo "Cache in use: $gb GB of 10 GB"
          if awk "BEGIN { exit !($used > 9 * 1073741824) }"; then
            echo "::warning::Actions caches use $gb GB of 10 GB; GitHub will soon evict some and builds will slow down."
          fi
