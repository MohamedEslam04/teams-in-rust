# Keeps the build caches of the default branch warm, so a release tag (tags can only restore caches
# saved on the default branch) compiles only the workspace crates, not every dependency. Nothing
# here is published. The jobs build exactly what the release builds, with the same cache keys
# (`shared-key`, the package jobs' own keys) and the same cargo settings: keep them in step with
# release.yml, release-add.yml and packaging.yml.
#
# Runs after a push to dev that changes the third-party dependencies (Cargo.lock without the
# workspace versions that a release bump changes), the toolchain or the build recipes, so the next
# tag finds them; and nightly, which picks up a new stable compiler and keeps the caches recently
# used, so GitHub's 10 GB limit evicts something else first.
#
# Caches (about 8 GB): ci.yml's clippy, check and Windows test caches, the Linux and Windows release
# builds, and the RPM, Flatpak and AUR cargo targets. macOS is not warmed: it is not part of a tag
# release (release-add.yml), and its four caches would push the others out of the 10 GB.
name: Cache warm-up

on:
  schedule:
    # Every night (UTC); a run with nothing new only restores and checks the caches.
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - Cargo.lock
      - rust-toolchain*
      - packaging/rpm/**
      - packaging/flatpak/**
      - packaging/aur/**
      - scripts/ci/**
      - .github/workflows/cache-warm.yml
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/workflows/packaging.yml

concurrency:
  group: cache-warm
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # As in release.yml.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  # A push that only bumps the workspace versions (chore(release)) changes Cargo.lock but none of
  # the caches: skip it instead of building everything again next to the release it starts.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      warm: ${{ steps.c.outputs.warm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          warm=true
          if [[ "$GITHUB_EVENT_NAME" == push ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
            echo "$changed"
            if ! grep -qv '^Cargo.lock$' <<<"$changed"; then
              git show "$BEFORE:Cargo.lock" > /tmp/before.lock
              if [[ $(bash scripts/ci/deps-hash.sh /tmp/before.lock) == $(bash scripts/ci/deps-hash.sh) ]]; then
                echo "Only workspace versions changed in Cargo.lock: the caches are current."
                warm=false
              fi
            fi
          fi
          echo "warm=$warm" >> "$GITHUB_OUTPUT"

  # Linux clippy and tests and the Windows tests: run on the default branch, ci.yml saves their
  # caches (release-add.yml restores the Windows one).
  gate:
    needs: changes
    if: needs.changes.outputs.warm == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      all-platforms: true
      skip-macos: true

  # The RPM, Flatpak and AUR cargo targets are saved from here; the release restores them.
  packages:
    needs: changes
    if: needs.changes.outputs.warm == 'true'
    uses: ./.github/workflows/packaging.yml

  linux:
    needs: changes
    if: needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: More swap
        # As release.yml: the ironteams crate needs more than the runner's ~16 GB.
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config squashfs-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
          # The dependencies are what the release needs; a failure in the ironteams crate itself
          # (for example the runner running out of memory) must not leave the tag without them.
          cache-on-failure: true
      # The build the release does, with the MCP server too when IRONTEAMS_MCP is 1, so the
      # cached dependencies match (scripts/ci/release-build.sh).
      - name: Build
        run: bash scripts/ci/release-build.sh
        env:
          BIN: ironteams
          IRONTEAMS_MCP: ${{ vars.IRONTEAMS_MCP }}

  windows:
    needs: changes
    if: needs.changes.outputs.warm == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
          cache-on-failure: true
      # The build the release does, with the MCP server too when IRONTEAMS_MCP is 1, so the
      # cached dependencies match (scripts/ci/release-build.sh).
      - name: Build
        run: bash scripts/ci/release-build.sh
        env:
          BIN: ironteams
          IRONTEAMS_MCP: ${{ vars.IRONTEAMS_MCP }}

  # GitHub keeps 10 GB of caches per repository and drops the least recently used beyond that, which
  # would send a release back to a cold build. Two kinds of cache are deleted:
  # - an older generation: the same cache (key without its trailing hashes and compiler version)
  #   saved again for newer dependencies or a newer compiler; only the newest copy is restored;
  # - a cache nobody restored for 3 days (every run here restores every cache in use).
  # Caches used in the last 6 hours stay, so a run that is restoring one right now keeps it.
  cache-usage:
    needs: [gate, packages, linux, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          now=$(date -u +%s)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            -q '.actions_caches[] | [.id, .key, .ref, .created_at, .last_accessed_at] | @tsv' > caches.tsv
          # family = the key without trailing "-<hex hash>" and "-<x.y.z>" parts.
          while IFS=$'\t' read -r id key ref created accessed; do
            fam=$(sed -E ':a; s/-([0-9a-f]{8,}|[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*)$//; ta' <<<"$key")
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$fam|$ref" "$created" "$id" "$key" "$accessed" "$ref"
          done < caches.tsv | sort -t$'\t' -k1,1 -k2,2r > families.tsv
          prev=
          while IFS=$'\t' read -r fam created id key accessed ref; do
            age=$(( now - $(date -u -d "$accessed" +%s) ))
            if [[ "$fam" == "$prev" && $age -gt 21600 ]]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" >/dev/null && echo "deleted older generation $key ($ref)"
            elif (( age > 3 * 86400 )); then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" >/dev/null && echo "deleted stale $key ($ref)"
            fi
            prev=$fam
          done < families.tsv
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            -q '.actions_caches[] | "\(.size_in_bytes / 1048576 | floor) MB  \(.ref)  \(.key)"' | sort -rn
          used=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" -q .active_caches_size_in_bytes)
          gb=$(awk "BEGIN { printf \"%.1f\", $used / 1073741824 }")
          echo "Cache in use: $gb GB of 10 GB"
          if awk "BEGIN { exit !($used > 9 * 1073741824) }"; then
            echo "::warning::Actions caches use $gb GB of 10 GB; GitHub will soon evict some and builds will slow down."
          fi
