# Publishes the static website in site/ to GitHub Pages (https://mohamedeslam04.github.io/teams-in-rust/).
# There is no build step: the folder is uploaded as it is. The repository setting
# Settings > Pages > Source must be "GitHub Actions" once; this workflow does not change it.
name: Pages

on:
  push:
    branches: [dev]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
