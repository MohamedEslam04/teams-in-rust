name: CI

on:
  push:
    # Feature and fix branches too: local builds are memory-bound, so CI does the full check.
    branches: [dev, 'feat/**', 'fix/**']
    # Docs-only pushes need no build.
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  # A manual run (Actions tab, or `gh workflow run CI --ref dev`) also tests Windows and macOS.
  workflow_dispatch:
  # release.yml runs the whole gate, every system included, before it publishes anything.
  workflow_call:
    inputs:
      all-platforms:
        type: boolean
        default: false
      # Leave the Windows or the two macOS runners out of all-platforms (a tag release builds and
      # publishes Linux only; a manual run adds Windows or macOS to that release). Compared with
      # true, not false: an unset input (push, manual run) must keep every system.
      skip-windows:
        type: boolean
        default: false
      skip-macos:
        type: boolean
        default: false

# A newer run for the same branch cancels the older one. The group is the branch name, not
# `github.ref`: a push to a PR's branch starts a push run (refs/heads/<b>) and a pull_request run
# (refs/pull/<n>/merge) for the same commit, and keyed on the branch only the newest of them goes on.
concurrency:
  # Called from release.yml, `github.workflow` is "Release": its own group.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds once from a clean tree: incremental data and debug info only cost time and cache.
  # test-build.yml sets the same two, so it can reuse this cache.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Formatting and clippy on Linux, in parallel with the tests below.
  clippy:
    runs-on: ubuntu-latest
    # A hung runner stops here instead of holding the queue for hours. A cold build (new
    # dependencies, an evicted cache) takes 30-35 minutes, so 45.
    timeout-minutes: 45
    env:
      # mold links the large test and GUI binaries several times faster than the default linker.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # Unused dependencies: a static scan of the manifests, so it needs no build.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
      # The Slint UI's layers and colour tokens (crates/ironteams/ui/README.md).
      - run: bash scripts/check-ui-layers.sh
      # clippy checks the GUI crate's binary and test targets at once; that outgrows the runner's
      # memory and GitHub kills the runner (exit 143, "shutdown signal"). Extra swap absorbs it.
      - name: More swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -h
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config mold
      - uses: Swatinem/rust-cache@v2
        with:
          # Feature branches restore the dev cache; only dev saves, so the 10 GB limit holds.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # The GUI crate's bin and its test build are the two largest rustc processes (~7 GB each);
      # `--all-targets` runs them side by side and the runner was killed with exit 143 despite the
      # swap above. Even the bin first was not enough: its test target then ran beside the other
      # crates' tests. So the other crates go first, then the GUI bin, then its tests alone.
      - run: cargo clippy --workspace --exclude ironteams --all-targets -- -D warnings
      - run: cargo clippy -p ironteams --bins -- -D warnings
      - run: cargo clippy -p ironteams --all-targets -- -D warnings
      - run: cargo clippy -p ironteams-cli --features mcp --all-targets -- -D warnings

  # The Linux tests. The job is named `check` so test-build.yml restores this job's cache.
  check:
    runs-on: ubuntu-latest
    # A cold build (new dependencies, an evicted cache) took 35 minutes and was cancelled at 30.
    timeout-minutes: 45
    env:
      # mold links the large test and GUI binaries several times faster than the default linker.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # nextest runs each test in its own process and kills one that runs past the limit in
      # .config/nextest.toml (profile ci), naming it in the log.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The GUI crate's test build can outgrow the runner's memory too (exit 143), as clippy does.
      - name: More swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -h
      # Some runs hung until the job limit and lost their whole log: the timeout around cargo
      # never fired and the job ended 10 minutes after the limit, so the runner itself had
      # stopped answering, starved of memory. The build and the tests run in this cgroup: past
      # its limit they swap, and past the swap the kernel kills a test or rustc in it, never the
      # runner, so the log survives and names what grew.
      - name: Memory fence
        run: |
          echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          sudo mkdir /sys/fs/cgroup/ci-tests
          echo 13G | sudo tee /sys/fs/cgroup/ci-tests/memory.max >/dev/null
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config mold
      - uses: Swatinem/rust-cache@v2
        with:
          # Feature branches restore the dev cache; only dev saves, so the 10 GB limit holds.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # Build and run are separate steps with their own limits, so the log says which stalled.
      # Each step first moves its shell into the memory fence.
      - name: Build the tests
        timeout-minutes: 35
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/ci-tests/cgroup.procs >/dev/null
          cargo test --workspace --no-run
      - name: Run the tests
        timeout-minutes: 15
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/ci-tests/cgroup.procs >/dev/null
          cargo nextest run --workspace --profile ci
      # nextest does not run doctests.
      - name: Doctests
        timeout-minutes: 10
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/ci-tests/cgroup.procs >/dev/null
          cargo test --workspace --doc
      - name: MCP tests
        timeout-minutes: 15
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/ci-tests/cgroup.procs >/dev/null
          cargo nextest run -p ironteams-cli --features mcp --profile ci
      # How close the build and the tests came to the fence, and whether the kernel killed
      # anything in it (oom_kill).
      - name: Memory used
        if: always()
        run: |
          cd /sys/fs/cgroup/ci-tests || exit 0
          echo "peak RAM $(numfmt --to=iec < memory.peak), peak swap $(numfmt --to=iec < memory.swap.peak)"
          cat memory.events
          free -h

  # The tests on Windows and macOS (Apple Silicon and Intel). Formatting and clippy run once, on
  # Linux: a second full compile of the GUI crate for clippy doubled these jobs (about 40 min on
  # macos-latest), and a compile error still fails the test build. UI tests run on Slint's
  # testing backend, so no display is needed. These runs are slow, so feature branches and pull
  # requests get the Linux gate only; cache-warm.yml checks Windows on dev, a manual run
  # (`gh workflow run CI --ref dev`) every system, and release-add.yml (a job with this id and env,
  # so it restores this cache) the system it adds to a release.
  platforms:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (inputs.all-platforms && !(inputs.skip-windows == true && inputs.skip-macos == true))
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
        exclude:
          - os: ${{ inputs.skip-windows == true && 'windows-latest' || 'none' }}
          - os: ${{ inputs.skip-macos == true && 'macos-latest' || 'none' }}
          - os: ${{ inputs.skip-macos == true && 'macos-15-intel' || 'none' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      # Fixtures and include_str! files must keep LF line endings on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A cold build of the workspace takes long here; keep what compiled even when a check
          # fails. Only dev saves, so these large caches don't evict the Linux ones.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo test --workspace --no-fail-fast
