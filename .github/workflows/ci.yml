name: CI

on:
  push:
    # Feature branches too: local builds are memory-bound, so CI does the full check.
    branches: [main, dev, 'feat/**']
    # Docs-only pushes need no build.
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  # A manual run (Actions tab, or `gh workflow run CI --ref dev`) also checks Windows and macOS.
  workflow_dispatch:
  # release.yml runs the whole gate, every system included, before it publishes anything.
  workflow_call:
    inputs:
      all-platforms:
        type: boolean
        default: false

# A newer push to the same branch cancels the older run.
concurrency:
  # Called from release.yml, `github.workflow` is "Release": its own group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds once from a clean tree: incremental data and debug info only cost time and cache.
  # test-build.yml sets the same two, so it can reuse this cache.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Formatting and clippy on Linux, in parallel with the tests below.
  clippy:
    runs-on: ubuntu-latest
    env:
      # mold links the large test and GUI binaries several times faster than the default linker.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # clippy checks the GUI crate's binary and test targets at once; that outgrows the runner's
      # memory and GitHub kills the runner (exit 143, "shutdown signal"). Extra swap absorbs it.
      - name: More swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -h
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config mold
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p ironteams-cli --features mcp --all-targets -- -D warnings

  # The Linux tests. The job is named `check` so test-build.yml restores this job's cache.
  check:
    runs-on: ubuntu-latest
    env:
      # mold links the large test and GUI binaries several times faster than the default linker.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config mold
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p ironteams-cli --features mcp

  # The same clippy and test gate on Windows and macOS (Apple Silicon and Intel). Formatting is
  # checked once, on Linux. UI tests run on Slint's testing backend, so no display is needed.
  # A cold macOS build takes about an hour, so these run for pull requests, manual runs and the
  # release gate only; every push gets the fast Linux gate.
  platforms:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.all-platforms
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Fixtures and include_str! files must keep LF line endings on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # A cold build of the workspace takes long here; keep what compiled even when a check
          # fails. Only dev and main save, so these large caches don't evict the Linux ones.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - run: cargo test --workspace --no-fail-fast
