# The Linux release for a `v*` tag: the builds below are attached to a new GitHub release (a manual
# run or a ci/release-* branch only uploads them as workflow artifacts):
#   Linux    Velopack AppImage (updates itself) and tar.gz, plus the RPM and Flatpak of
#            packaging.yml (their package managers update those; the AUR package is only checked)
# Velopack also writes the full and delta .nupkg packages and the releases.linux.json feed;
# installed copies read the feeds from the published releases and download only what changed.
#
# Windows and macOS take much longer to build, so a tag releases Linux only. Each is added to that
# same release afterwards by release-add.yml, which tests and builds only that system from the
# tag's commit and uploads only its files (Linux is not rebuilt or uploaded again):
#   gh workflow run release-add.yml -f tag=vX.Y.Z -f platform=windows   (or platform=macos)
# For every tag to include them, set the repository variable RELEASE_ADD_PLATFORMS to "windows",
# "macos" or "windows macos": the add-ons then run right after the Linux release is published.
#
# Nothing is published unless the CI gate (fmt, clippy and every test on Linux) passes, every
# package builds, and the packaged AppImage passes `--self-check --packaged`. A tag with a
# pre-release suffix (v1.2.0-beta.1) is published as a GitHub pre-release: only copies with
# "Get beta updates" on take it.
#
# Signing (Windows and macOS, in release-add.yml) is optional: with the secrets below it signs (and
# notarizes on macOS), without them it warns and ships unsigned.
#   Windows  WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD
#   macOS    APPLE_CERT_P12 (base64 .p12 with both Developer ID certificates), APPLE_CERT_PASSWORD,
#            APPLE_APP_IDENTITY, APPLE_INSTALLER_IDENTITY, APPLE_ID, APPLE_TEAM_ID,
#            APPLE_APP_PASSWORD (an app-specific password for notarytool)
# Icons are rendered from packaging/<APP_ID>.svg; the Windows and macOS packages also ship the
# English and Arabic Hunspell dictionaries (packaging/release/). The product name, app id and
# binary come from the env block below.
#
# Build time: the dependencies come from caches that cache-warm.yml saves on dev (a tag can only
# restore caches of the default branch), so a release compiles the workspace crates only.
name: Release

on:
  push:
    tags: ['v*']
    # A branch named ci/release-* builds everything without publishing, to try workflow changes
    # before they reach the default branch (a manual run needs the workflow there).
    branches: ['ci/release-*']
  workflow_dispatch:
    inputs:
      skip-gate:
        description: >-
          Skip the CI gate. Only for re-running a release whose Rust code already passed the full
          gate on every system (for example after a packaging-only fix).
        type: boolean
        default: false

# Read-only for every build job (they run downloaded tools and crate build scripts); only the
# publish job below may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 16 codegen units (thin LTO stays) instead of the profile's 1: the large ironteams crate compiles
  # in parallel, far faster on every runner, for a negligible runtime cost.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  # The name users see (.app bundle, Start menu, artifact file names) and the Velopack pack id.
  APP_NAME: IronTeams
  # Reverse-DNS id: macOS bundle identifier, and the name of the .desktop, .svg and .metainfo.xml.
  APP_ID: io.github.mohamedeslam04.ironteams
  # The cargo package and binary that is shipped.
  BIN: ironteams
  # The Velopack CLI; the same version as the `velopack` crate in crates/ironteams/Cargo.toml.
  VPK_VERSION: 1.2.161

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v=${GITHUB_REF_NAME#v}
          else v=$(sed -n 's/^version = "\(.*\)"/\1/p' "crates/$BIN/Cargo.toml" | head -1); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # v1.2.0-beta.1 and the like: a GitHub pre-release, for beta updates only.
          if [[ "$v" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  # fmt, clippy and the full test suite on Linux (release-add.yml runs the Windows and macOS tests
  # before it adds those systems).
  gate:
    if: ${{ !inputs.skip-gate }}
    uses: ./.github/workflows/ci.yml

  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick icnsutils
      - run: bash packaging/release/icons.sh icons "packaging/$APP_ID.svg"
      - run: bash packaging/release/dictionaries.sh dictionaries
      - uses: actions/upload-artifact@v7
        with:
          name: shared-assets
          path: |
            icons/app.ico
            icons/app.icns
            icons/app-512.png
            dictionaries/

  linux:
    needs: [meta, icons]
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: More swap
        # Compiling the ironteams crate needs more than the runner's ~16 GB: without swap rustc is
        # killed or the runner shuts down mid-build.
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -h
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config squashfs-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
          # A tag cannot pass its cache to the next tag; cache-warm.yml saves these on dev.
          save-if: false
      - run: cargo build --release --locked -p "$BIN" --bin "$BIN"
      - uses: actions/download-artifact@v8
        with:
          name: shared-assets
          path: assets
      - name: tar.gz
        run: |
          d=$APP_NAME-$VERSION-linux-x86_64
          mkdir -p "$d"
          cp "target/release/$BIN" "packaging/$APP_ID.desktop" "packaging/$APP_ID.svg" "packaging/$APP_ID.metainfo.xml" LICENSE README.md "$d/"
          tar -czf "$d.tar.gz" "$d"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Velopack AppImage
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p pack
          cp "target/release/$BIN" LICENSE pack/
          bash packaging/release/velopack.sh linux pack "$BIN" assets/icons/app-512.png \
            --runtime linux-x64 --categories 'Network;Chat;InstantMessaging;'
      - name: Smoke test (the packaged AppImage)
        run: |
          img=$(realpath "$(ls velopack-out/*.AppImage | head -1)")
          chmod +x "$img"
          mkdir smoke && cd smoke
          "$img" --appimage-extract >/dev/null
          APPIMAGE=$img ./squashfs-root/usr/bin/$BIN --self-check --packaged
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            *.tar.gz
            velopack-out/*

  # The RPM and the Flatpak (and the AUR package check) as packaging.yml builds them.
  packages:
    uses: ./.github/workflows/packaging.yml

  publish:
    # Only when the gate, every build and every smoke test succeeded: a release never goes out
    # untested or with missing packages.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
      && (needs.gate.result == 'success' || (inputs.skip-gate && needs.gate.result == 'skipped'))
    needs: [meta, gate, linux, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Everything this run uploaded (also packaging.yml's RPM and Flatpak), one folder per
          # artifact; only package files are attached below.
          path: out
      - name: Release
        run: |
          mapfile -t files < <(find out -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.rpm' \
            -o -name '*.flatpak' -o -name '*.AppImage' -o -name '*.nupkg' -o -name '*.exe' -o -name '*.pkg' \
            -o -name 'releases.*.json' -o -name 'RELEASES*' \) | sort)
          printf '%s\n' "${files[@]}"
          # Two assets with one name would overwrite each other (and mix up two channels' feeds).
          dups=$(printf '%s\n' "${files[@]}" | xargs -n1 basename | sort | uniq -d)
          if [[ -n "$dups" ]]; then echo "::error::assets with the same name: $dups"; exit 1; fi
          pre=()
          [[ "$PRERELEASE" == true ]] && pre=(--prerelease)
          # A draft while the files upload; clients only see it once it is published.
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft "${pre[@]}" \
                 --title "$APP_NAME $GITHUB_REF_NAME" --notes "Builds for Linux; Windows and macOS builds may be added to this release later. Installed copies update themselves."
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false "${pre[@]}"

  # Windows and macOS right after the Linux release, when the repository variable
  # RELEASE_ADD_PLATFORMS names them (see the top of this file). Each adds only its own files.
  add-windows:
    if: needs.publish.result == 'success' && contains(vars.RELEASE_ADD_PLATFORMS, 'windows')
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-add.yml
    with:
      tag: ${{ github.ref_name }}
      platform: windows
    secrets: inherit

  add-macos:
    if: needs.publish.result == 'success' && contains(vars.RELEASE_ADD_PLATFORMS, 'macos')
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-add.yml
    with:
      tag: ${{ github.ref_name }}
      platform: macos
    secrets: inherit
