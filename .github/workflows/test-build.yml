# A quick ironteams binary for trying a branch on the desktop, where the GUI crate needs more memory
# than the machine has. Push the branch as ci/build-<name> (it must contain this file); the run
# reuses the dependency cache of the CI `check` job, builds the debug `ironteams` binary and uploads it
# as the `ironteams-bin` artifact. Fetch it with `gh run download <run> -n ironteams-bin`.
name: Test build

on:
  workflow_dispatch:
  push:
    branches: ['ci/build-*']

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The same as ci.yml, so the cached dependencies of its `check` job match this build.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Named like the CI job so Swatinem/rust-cache restores that job's cache.
  check:
    runs-on: ubuntu-latest
    # A cold build (new Cargo.lock, no cache yet) takes longer than 30 minutes.
    timeout-minutes: 60
    env:
      # mold links the large test and GUI binaries several times faster than the default linker.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config mold
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: cargo build -p ironteams --bin ironteams
      - run: strip target/debug/ironteams
      - uses: actions/upload-artifact@v7
        with:
          name: ironteams-bin
          path: target/debug/ironteams
          retention-days: 3
